services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:./data/strackerr.db}
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: change-me-jwt-secret
      PORT: 3000
      NODE_ENV: production
      DATA_DIR: ./data
      API_V1_THROTTLE_LIMIT: ${API_V1_THROTTLE_LIMIT:-300}
      API_V1_THROTTLE_TTL_MS: ${API_V1_THROTTLE_TTL_MS:-60000}
    volumes:
      - ./data:/app/data
