services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:./data/dev.db
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: change-me-jwt-secret
      PORT: 3000
      NODE_ENV: production
      DATA_DIR: ./data
    volumes:
      - ./data:/app/data
